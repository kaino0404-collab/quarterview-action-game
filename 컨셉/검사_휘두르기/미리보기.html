<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검사 휘두르기 미리보기</title>
<style>
  :root { --bg:#16181c; --panel:#22252b; --fg:#e8e8ea; --dim:#9aa0a8; --acc:#ffd34d; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .stage { position:relative; height:420px; background:#2a2d33; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .stage img { height:380px; image-rendering:auto; transition:none; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .label { position:absolute; left:12px; top:10px; font-size:15px; color:var(--acc); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }
  button { background:var(--panel); color:var(--fg); border:1px solid #3a3e46; border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button.on { border-color:var(--acc); color:var(--acc); }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { border-bottom:1px solid #30333a; padding:6px 8px; text-align:left; }
  th { color:var(--dim); font-weight:normal; }
  tr.cur td { color:var(--acc); }
  .strip { display:flex; gap:6px; overflow-x:auto; }
  .strip img { height:90px; background:#2a2d33; border-radius:6px; }
  .note { color:var(--dim); font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>검사 휘두르기 — 리미티드 애니메이션 미리보기 (오른쪽 보기)</h1>
  <div class="stage" id="stage"><img id="img" alt=""><div class="flash" id="flash"></div><div class="label" id="label"></div></div>
  <div class="row">
    <button id="mLimited" class="on">리미티드 (장마다 시간 다르게)</button>
    <button id="mEven">고르게 (모든 장 같은 시간)</button>
    <button id="bStop">히트스톱 켜짐</button>
    <button id="bSlow">속도 1x</button>
    <button id="bPause">일시정지</button>
  </div>
  <table id="tbl"><thead><tr><th>장</th><th>역할</th><th>보여 주는 시간 (60fps 프레임)</th></tr></thead><tbody></tbody></table>
  <div class="row strip" id="strip"></div>
  <p class="note">프레임 숫자는 게임 기준 60fps 입니다. 리미티드 = 준비는 잠깐, 번짐은 아주 짧게, 타격 포즈는 길게 (히트스톱 동안 화면 흔들림·번쩍임), 따라가기·돌아오기는 보통.
  비교용 "고르게" 는 모든 장을 6프레임씩 보여 줍니다. 원본 키 포즈는 힉스필드로 한 장에 뽑은 시트를 잘라 쓴 것이라 장 사이 위치가 조금 어긋날 수 있습니다.</p>
</div>

const S = k => SRC[k.replace('.png','')];
const LIMITED = [
  { f:"f5.png", name:"대기",       n:40 },
  { f:"f1.png", name:"준비",       n:7 },
  { f:"f2.png", name:"번짐 (스미어)", n:2 },
  { f:"f3.png", name:"타격 포즈",   n:4, hit:true },
  { f:"f4.png", name:"따라가기",    n:7 },
  { f:"f5.png", name:"돌아오기",    n:8 },
];
const HITSTOP = 9;
const EVEN = LIMITED.map(s => ({ ...s, n: s.name === "대기" ? 40 : 6 }));
let seq = LIMITED, hitstop = true, speed = 1, paused = false;
let i = 0, t = 0, stopT = 0, last = performance.now(), acc = 0;
const img = document.getElementById("img"), flash = document.getElementById("flash"), label = document.getElementById("label");
const pre = {}; ["f1","f2","f3","f4","f5"].forEach(k => { const im = new Image(); im.src = SRC[k]; pre[k] = im; });
document.getElementById("strip").innerHTML = ["f1","f2","f3","f4","f5"].map(k => `<img src="${SRC[k]}" alt="">`).join("");
function drawTable() {
  document.querySelector("#tbl tbody").innerHTML = seq.map((s, k) =>
    `<tr class="${k === i ? "cur" : ""}"><td>${s.f.replace(".png","")}</td><td>${s.name}</td><td>${s.n}${s.hit && hitstop ? " + 히트스톱 " + HITSTOP : ""}</td></tr>`).join("");
}
function show() {
  const s = seq[i]; img.src = S(s.f); label.textContent = s.name; drawTable();
  if (s.hit && hitstop) { stopT = HITSTOP; flash.style.opacity = .35; }
}
function step() {   // 60fps 한 프레임
  if (stopT > 0) {
    stopT--; const k = stopT / HITSTOP;
    img.style.transform = `translate(${(Math.random()-.5)*14*k}px, ${(Math.random()-.5)*8*k}px)`;
    flash.style.opacity = Math.max(0, .35 * (k - .6));
    return;
  }
  img.style.transform = ""; flash.style.opacity = 0;
  if (++t >= seq[i].n) { t = 0; i = (i + 1) % seq.length; show(); }
}
function loop(now) {
  if (!paused) { acc += (now - last) * speed; while (acc >= 1000/60) { acc -= 1000/60; step(); } }
  last = now; requestAnimationFrame(loop);
}
function mode(m) { seq = m; i = 0; t = 0; stopT = 0; show();
  document.getElementById("mLimited").classList.toggle("on", m === LIMITED);
  document.getElementById("mEven").classList.toggle("on", m === EVEN); }
document.getElementById("mLimited").onclick = () => mode(LIMITED);
document.getElementById("mEven").onclick = () => mode(EVEN);
document.getElementById("bStop").onclick = e => { hitstop = !hitstop; e.target.textContent = "히트스톱 " + (hitstop ? "켜짐" : "꺼짐"); e.target.classList.toggle("on", hitstop); drawTable(); };
document.getElementById("bSlow").onclick = e => { speed = speed === 1 ? .5 : speed === .5 ? .25 : 1; e.target.textContent = "속도 " + speed + "x"; };
document.getElementById("bPause").onclick = e => { paused = !paused; e.target.textContent = paused ? "다시 재생" : "일시정지"; };
document.getElementById("bStop").classList.add("on");
show(); requestAnimationFrame(loop);
</script>
